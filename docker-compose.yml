# Build from this repo (development / first-time image):
#   WEBTOOLS_VERSION="$(node -p "require('./package.json').version")" docker compose up --build -d
#
# Homelab pull-only example (no git clone of the app):
#   see docker-compose.example.yml
#
# Portainer:
#   use portainer-stack.yml (no build: — Portainer only pulls the image)


services:
  webtools:
    image: ghcr.io/narehood/webtools:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${WEBTOOLS_VERSION:?Set WEBTOOLS_VERSION to the version in package.json}
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PHOTO_REPAIR_IMAGE_MODEL: ${PHOTO_REPAIR_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      PHOTO_REPAIR_VISION_MODEL: ${PHOTO_REPAIR_VISION_MODEL:-gpt-5-mini}
    volumes:
      - photo-repair-data:/app/data/photo-repair
    restart: unless-stopped

volumes:
  photo-repair-data:
